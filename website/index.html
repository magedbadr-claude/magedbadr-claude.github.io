<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../favicon.png">
<title>Sporteqo Web Demo</title>
<meta name="description" content="Clickable Sporteqo product demo: player app, website, business dashboard and admin console with fictional Cairo data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,700;1,800&display=swap">
<style>
/* Layout: sticky product switcher on top; each experience renders in <main>. The player app sits in a phone frame on desktop and goes full-bleed on phones. */
:root {
  --bg: #F7F9FB; --surface: #FFFFFF; --surface-2: #F1F5F9; --stage: #E8EEF2;
  --text: #111827; --muted: #6B7280; --border: #E5E7EB; --border-strong: #D1D5DB;
  --brand: #0B8F6A; --brand-text: #087A5A; --action: #087A5A; --action-pressed: #05664B; --on-action: #FFFFFF;
  --brand-soft: #E8F8F2; --brand-soft-2: #C6EEDF; --electric: #14C08E;
  --gold: #FFB800; --gold-soft: #FFF3D1; --on-gold: #0B1220;
  --ink: #0B1220; --ink-2: #111827; --on-ink: #FFFFFF; --on-ink-muted: #A8B3C2;
  --danger: #D63A40; --danger-soft: #FDECEC; --warning: #B86E00; --warning-soft: #FEF3C7; --info: #2F6FD0; --info-soft: #E6EFFC;
  --slot-taken: #E5E7EB; --slot-taken-text: #9CA3AF;
  --cat-wear: #E8F8F2; --cat-equip: #E7EFF8; --cat-nutri: #FFF3D1;
  --shadow: 0 2px 8px rgba(0,0,0,.08); --shadow-raised: 0 8px 24px rgba(11,18,32,.12);
  --lg-ink: #0B1220; --lg-eqo: #0B8F6A; --lg-tag: #0B8F6A; --lg-lane: #FFFFFF; --lg-dot: #0B1220;
  --font: 'Poppins', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-num: 'Montserrat', 'Poppins', system-ui, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-pill: 20px;
  --btn-h: 52px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1018; --surface: #121B26; --surface-2: #192431; --stage: #070C12;
    --text: #E8EEF3; --muted: #9AA6B2; --border: #243241; --border-strong: #33455A;
    --brand: #14C08E; --brand-text: #3FD3A5; --brand-soft: #0F2A22; --brand-soft-2: #134034;
    --gold-soft: #3A2E10; --danger: #FF6B70; --danger-soft: #3A1A1C; --warning: #F5B341; --warning-soft: #3A2E12; --info: #7FB0FF; --info-soft: #182B45;
    --slot-taken: #1E2A37; --slot-taken-text: #5E6B79;
    --cat-wear: #12302A; --cat-equip: #152538; --cat-nutri: #3A2E10;
    --shadow: 0 2px 8px rgba(0,0,0,.4); --shadow-raised: 0 8px 24px rgba(0,0,0,.5);
    --lg-ink: #FFFFFF; --lg-eqo: #14C08E; --lg-tag: #14C08E; --lg-lane: #0A1018; --lg-dot: #FFB800;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1018; --surface: #121B26; --surface-2: #192431; --stage: #070C12;
  --text: #E8EEF3; --muted: #9AA6B2; --border: #243241; --border-strong: #33455A;
  --brand: #14C08E; --brand-text: #3FD3A5; --brand-soft: #0F2A22; --brand-soft-2: #134034;
  --gold-soft: #3A2E10; --danger: #FF6B70; --danger-soft: #3A1A1C; --warning: #F5B341; --warning-soft: #3A2E12; --info: #7FB0FF; --info-soft: #182B45;
  --slot-taken: #1E2A37; --slot-taken-text: #5E6B79;
  --cat-wear: #12302A; --cat-equip: #152538; --cat-nutri: #3A2E10;
  --shadow: 0 2px 8px rgba(0,0,0,.4); --shadow-raised: 0 8px 24px rgba(0,0,0,.5);
  --lg-ink: #FFFFFF; --lg-eqo: #14C08E; --lg-tag: #14C08E; --lg-lane: #0A1018; --lg-dot: #FFB800;
  color-scheme: dark;
}
[dir="rtl"] { --font: 'Cairo', 'Poppins', system-ui, sans-serif; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
.num, .money { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.sm { width: 16px; height: 16px; }
.ico.xs { width: 14px; height: 14px; }
[dir="rtl"] .flip { transform: scaleX(-1); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--border); }
.ribbon { display: block; text-align: center; background: var(--gold); color: var(--on-gold); font-size: 12px; font-weight: 600; padding: 3px 16px; letter-spacing: .02em; }
.ribbon b { margin-inline-end: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
.topin { display: flex; align-items: center; gap: 16px; padding: 10px 16px; max-width: 1280px; margin: 0 auto; flex-wrap: wrap; }
.logo { display: block; height: 34px; width: auto; }
.logo-m { width: 28px; height: 28px; }
.switch { display: grid; grid-template-columns: repeat(5, auto); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 14px; margin-inline-start: auto; }
.switch a { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; color: var(--muted); text-decoration: none; font-weight: 500; font-size: 13px; white-space: nowrap; }
.switch a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.switch a[aria-current="page"] .ico { color: var(--brand); }
.langs { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--action); color: var(--on-action); }
.soon { font-size: 11px; color: var(--muted); line-height: 1.2; }
@media (max-width: 860px) {
  .rb-long { display: none; }
  .topin { gap: 8px 12px; }
  .switch { order: 3; width: 100%; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0; }
  .switch a { justify-content: center; padding: 8px 4px; font-size: 12px; }
  .switch a .ico { display: none; }
  .langs { margin-inline-start: auto; }
  .soon { display: none; }
  .logo { height: 28px; }
}

/* ---------- shared atoms ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--btn-h); padding: 0 20px; border-radius: var(--r-md); border: 0; background: var(--action); color: var(--on-action); font-weight: 600; font-size: 15px; text-decoration: none; transition: background .12s; }
.btn:hover { background: var(--action-pressed); }
.btn:disabled { background: var(--border-strong); color: var(--surface); cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--brand-text); border: 1.5px solid var(--border-strong); }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.sm { min-height: 40px; font-size: 13px; padding: 0 14px; border-radius: 10px; }
.btn.danger { background: var(--danger); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); }
.chip .ico { color: var(--brand); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--brand-soft); color: var(--brand-text); }
.badge.gold { background: var(--gold); color: var(--on-gold); }
.badge.warn { background: var(--warning-soft); color: var(--warning); }
.badge.bad { background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--info-soft); color: var(--info); }
.rt { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; font-size: 13px; }
.rt svg { width: 14px; height: 14px; fill: var(--gold); stroke: none; }
.rt .muted { font-weight: 400; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow); }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sect-h h3 { font-size: 16px; font-weight: 600; }
.link { background: none; border: 0; color: var(--brand-text); font-weight: 600; font-size: 13px; padding: 4px 0; text-decoration: none; }
.toast { position: fixed; bottom: 24px; inset-inline-start: 50%; transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow-raised); font-weight: 500; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
[dir="rtl"] .toast { transform: translateX(50%); }
.toast[hidden] { display: none; }
.toast .ico { color: var(--electric); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--brand-text); }
[dir="rtl"] .eyebrow { letter-spacing: 0; }
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.input, select.input { height: var(--btn-h); border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); padding: 0 14px; width: 100%; min-width: 0; }
textarea.input { height: 88px; padding: 12px 14px; resize: vertical; }

/* venue / product art */
.lanes, .art .big { pointer-events: none; }
.welcome > :not(.lanes), .whero-in { position: relative; }
.art { position: relative; overflow: hidden; background: radial-gradient(120% 90% at 85% 10%, color-mix(in srgb, var(--c) 55%, #ffffff 25%) 0%, transparent 55%), linear-gradient(140deg, var(--c) 0%, color-mix(in srgb, var(--c) 40%, #0B1220) 100%); color: #fff; aspect-ratio: 16 / 9; max-width: 100%; }
.art .lanes { position: absolute; inset: 0; width: 100%; height: 100%; }
.art .lanes path { fill: none; stroke: #fff; stroke-opacity: .16; stroke-width: 1.5; }
.art .big { position: absolute; width: 46%; height: auto; aspect-ratio: 1; inset-inline-end: -6%; bottom: -14%; stroke: #fff; stroke-opacity: .28; stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.art .tag { position: absolute; inset-inline-start: 10px; top: 10px; display: flex; gap: 6px; }
.art .sm-ico { position: absolute; inset-inline-start: 12px; bottom: 10px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; }
.art .sm-ico .ico { width: 18px; height: 18px; color: #fff; }
.part { position: relative; display: grid; place-items: center; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--pc); max-width: 100%; }
.part .ico { width: 44%; height: 44%; stroke-width: 1.4; color: var(--brand); }
.part .pbadge { position: absolute; top: 8px; inset-inline-start: 8px; }
.part.equip .ico { color: var(--info); }
.part.nutri .ico { color: var(--warning); }

/* ---------- PLAYER APP ---------- */
.app-stage { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 48px; max-width: 1180px; margin: 0 auto; padding: 24px 16px 32px; align-items: start; }
.app-side { display: grid; gap: 16px; padding-top: 8px; max-width: 460px; }
.app-side h1 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
.app-side h1 em { font-style: italic; font-weight: 800; color: var(--brand); }
.app-side p { color: var(--muted); font-size: 15px; max-width: 46ch; }
.journey { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; grid-template-columns: 1fr 1fr; counter-reset: j; }
.journey button { width: 100%; display: flex; align-items: center; gap: 12px; text-align: start; border: 0; background: transparent; padding: 5px 10px; border-radius: 10px; color: var(--muted); font-weight: 500; }
.journey button:hover { background: var(--surface); }
.journey .n { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-strong); font-size: 12px; font-weight: 600; font-family: var(--font-num); }
.journey button[aria-current="step"] { color: var(--text); background: var(--surface); box-shadow: var(--shadow); }
.journey button[aria-current="step"] .n { background: var(--action); border-color: var(--action); color: #fff; }
.journey .done .n { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); }
.side-note { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--brand-soft); color: var(--text); font-size: 13px; }
.side-note .ico { color: var(--brand); }

.phone { width: 390px; height: clamp(640px, calc(100vh - var(--toph, 100px) - 48px), 820px); border-radius: 48px; background: var(--ink); padding: 12px; box-shadow: 0 30px 60px rgba(11,18,32,.25), 0 0 0 1px rgba(255,255,255,.06) inset; position: relative; }
.screen { position: relative; height: 100%; border-radius: 38px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.status { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; font-size: 14px; font-weight: 600; font-family: var(--font-num); direction: ltr; }
.status .nub { width: 110px; height: 30px; border-radius: 20px; background: var(--ink); }
.status svg { width: 16px; height: 16px; fill: currentColor; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; }
.scroll::-webkit-scrollbar { display: none; }
.dark-screen .status { color: #fff; }
.tabbar { flex: none; height: 72px; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--border); background: var(--surface); padding-bottom: 10px; }
.tabbar button { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); position: relative; min-height: 44px; }
.tabbar button[aria-current="page"] { color: var(--brand-text); }
.tabbar .dot { position: absolute; top: 6px; inset-inline-start: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--gold); color: var(--on-gold); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.sticky-cta { flex: none; padding: 12px 16px 16px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.sticky-cta .from { display: grid; font-size: 12px; color: var(--muted); }
.sticky-cta .from b { font-size: 16px; color: var(--text); }
.sticky-cta .btn { flex: 1; }
.pad { padding: 0 16px; }
.stack { display: grid; gap: 16px; }
.appbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px; }
.appbar h2 { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--text); flex: none; position: relative; }
.iconbtn.solid { background: var(--surface); box-shadow: var(--shadow); }
.iconbtn .dot { position: absolute; top: 6px; inset-inline-end: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--gold); color: var(--on-gold); font-size: 10px; font-weight: 700; display: grid; place-items: center; }

.welcome { min-height: 100%; background: linear-gradient(160deg, #0B1220 0%, #03392A 100%); color: #fff; display: flex; flex-direction: column; padding: 0 24px 28px; --lg-ink: #fff; --lg-eqo: #14C08E; --lg-tag: #14C08E; --lg-lane: #0B1220; --lg-dot: #FFB800; position: relative; overflow: hidden; }
.welcome .lanes { position: absolute; inset: 0; width: 100%; height: 100%; }
.welcome .lanes path { fill: none; stroke: #14C08E; stroke-opacity: .22; stroke-width: 1.5; }
.welcome .hero-m { width: 120px; height: 120px; margin: 72px auto 12px; position: relative; }
.welcome .wm { width: 230px; margin: 0 auto; position: relative; }
.welcome h1 { font-size: 26px; font-style: italic; font-weight: 800; text-align: center; margin-top: 40px; position: relative; }
.welcome p { text-align: center; color: #B9C6D3; margin: 10px auto 0; max-width: 28ch; position: relative; }
.welcome .grow { flex: 1; }
.welcome .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 28px 0 24px; position: relative; }
.welcome .stats div { text-align: center; padding: 10px 4px; border-radius: 12px; background: rgba(255,255,255,.06); }
.welcome .stats b { display: block; font-family: var(--font-num); font-size: 18px; color: #fff; }
.welcome .stats span { font-size: 11px; color: #B9C6D3; }
.welcome .btn.ghost { color: #fff; border-color: rgba(255,255,255,.35); }
.welcome .btn.ghost:hover { background: rgba(255,255,255,.08); }
.dots { display: flex; justify-content: center; gap: 6px; margin: 16px 0; position: relative; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); }
.dots i:first-child { width: 18px; background: #14C08E; }

.sp-group { display: grid; gap: 8px; }
.sp-group h4 { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.sp-group h4 i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.sp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sp { display: grid; justify-items: center; gap: 6px; padding: 10px 4px; border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface); font-size: 11px; font-weight: 500; text-align: center; line-height: 1.25; min-height: 78px; position: relative; }
.sp .ico { color: var(--brand); width: 22px; height: 22px; }
.sp[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.sp[aria-pressed="true"]::after { content: ''; position: absolute; top: 6px; inset-inline-end: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }

.hello { display: flex; align-items: center; gap: 12px; padding: 4px 16px 8px; }
.hello h2 { font-size: 20px; font-weight: 600; }
.hello .loc { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; border: 0; background: none; padding: 0; }
.hello .loc .ico { color: var(--brand); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-text); font-weight: 700; flex: none; font-size: 14px; }
.avatar.lg { width: 64px; height: 64px; font-size: 22px; }
.searchbox { display: flex; align-items: center; gap: 10px; height: var(--btn-h); padding: 0 14px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); color: var(--muted); width: 100%; text-align: start; }
.searchbox input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; color: var(--text); }
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding: 2px 16px 8px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { scroll-snap-align: start; }
.fcard { width: 240px; flex: none; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); text-align: start; padding: 0; display: block; }
.fcard .body { padding: 10px 12px 12px; display: grid; gap: 3px; }
.fcard h4 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.price { font-weight: 700; color: var(--brand-text); font-size: 13px; }
.price small { font-weight: 400; color: var(--muted); }
.vrow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding: 10px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); text-align: start; width: 100%; align-items: center; }
.vrow .art { border-radius: 10px; aspect-ratio: 1; }
.vrow .art .big { width: 80%; }
.vrow h4 { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .info { display: grid; gap: 3px; min-width: 0; }
.vrow .line { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pcard { width: 150px; flex: none; text-align: start; border: 0; background: none; padding: 0; display: grid; gap: 6px; }

.range { width: 100%; accent-color: var(--action); }

.amen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.minis { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.paym { display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: center; gap: 12px; padding: 12px; border: 1.5px solid var(--border); border-radius: var(--r-md); background: var(--surface); text-align: start; width: 100%; }

.paym .pi { width: 40px; height: 28px; border-radius: 6px; background: var(--surface-2); display: grid; place-items: center; color: var(--text); }
.paym .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border-strong); display: grid; place-items: center; }
.paym[aria-pressed="true"] .radio { border-color: var(--brand); }
.paym[aria-pressed="true"] .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--brand); }
.secured { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--muted); }

.done-hero h2 { font-size: 22px; font-weight: 700; }
.qrbox { display: grid; justify-items: center; gap: 8px; padding: 16px; border-radius: var(--r-lg); background: #fff; border: 1px solid var(--border); color: #0B1220; }

.qrbox code { font-family: var(--font-num); font-weight: 700; letter-spacing: .08em; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 16px; font-size: 13px; }

.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); }

.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.bk { display: grid; gap: 10px; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.bk .top-r { display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 12px; align-items: center; }
.bk .art { border-radius: 10px; aspect-ratio: 1; }
.bk h4 { font-size: 14px; font-weight: 600; }
.bk .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-wrap { position: absolute; inset: 0; background: rgba(11,18,32,.5); display: flex; align-items: flex-end; z-index: 20; }

.starrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.starrow span { font-size: 14px; font-weight: 500; min-width: 0; }
.stars { display: flex; gap: 2px; direction: ltr; }

.stars svg { width: 26px; height: 26px; fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; }
.stars button.on svg { fill: var(--gold); stroke: var(--gold); }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; }
.qchips .chip { min-height: 32px; font-size: 12px; }

.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 0 16px; }
.shop-grid .pcard { width: auto; }
.forwho { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 0 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); font-size: 13px; }
.forwho .tabs { flex: 1; padding: 3px; }
.forwho .tabs button { min-height: 34px; font-size: 12px; }
.cartline { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 10px; align-items: center; }
.cartline h5 { margin: 0; font-size: 13px; font-weight: 500; line-height: 1.3; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; }
.qty button { width: 32px; height: 32px; border: 0; background: none; display: grid; place-items: center; }
.qty span { min-width: 22px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.seller-h { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.track { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }

.track li:last-child::before { display: none; }
.track .b { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; }
.track .on .b { background: var(--action); border-color: var(--action); color: #fff; }
.track .on .b .ico { width: 14px; height: 14px; }
.prof-head { display: flex; gap: 14px; align-items: center; padding: 8px 16px; }
.stat3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 16px; }
.stat3 div { padding: 12px 8px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); text-align: center; }
.stat3 b { display: block; font-family: var(--font-num); font-size: 18px; }
.stat3 span { font-size: 11px; color: var(--muted); }
.menu { margin: 0 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
.menu > div, .menu > button { display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; border-bottom: 1px solid var(--border); background: none; width: 100%; text-align: start; font-size: 14px; }
.menu > :last-child { border-bottom: 0; }
.menu .ico { color: var(--brand); }
.menu .end { margin-inline-start: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.refcode { font-family: var(--font-num); font-weight: 700; letter-spacing: .06em; padding: 4px 10px; border-radius: 8px; border: 1.5px dashed var(--brand); color: var(--brand-text); }
.empty { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 32px 24px; color: var(--muted); }

@media (max-width: 900px) {
  .app-stage { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }
  .app-side { display: none; }
  .phone { width: 100%; height: calc(100svh - var(--toph, 112px)); min-height: 560px; border-radius: 0; padding: 0; box-shadow: none; background: var(--bg); }
  .screen { border-radius: 0; }

/* ---------- WEBSITE ---------- */
.web { --lg-ink: var(--text); }
.wnav { display: flex; align-items: center; gap: 24px; max-width: 1180px; margin: 0 auto; padding: 14px 16px; flex-wrap: wrap; }
.wnav nav { display: flex; gap: 4px; flex-wrap: wrap; }
.wnav nav button { border: 0; background: none; padding: 8px 12px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.wnav nav button[aria-current="page"] { color: var(--text); background: var(--surface-2); }
.wnav .end { margin-inline-start: auto; display: flex; gap: 8px; }
.whero { background: linear-gradient(160deg, #0B1220 0%, #03392A 100%); color: #fff; position: relative; overflow: hidden; }
.whero .lanes { position: absolute; inset: 0; width: 100%; height: 100%; }
.whero .lanes path { fill: none; stroke: #14C08E; stroke-opacity: .2; stroke-width: 1.5; }
.whero-in { position: relative; max-width: 1180px; margin: 0 auto; padding: 64px 16px 56px; display: grid; gap: 20px; }
.whero h1 { font-size: clamp(40px, 7vw, 76px); font-weight: 800; font-style: italic; letter-spacing: -.02em; line-height: 1; }
.whero h1 span { color: #14C08E; }
.whero h1 .dot { color: var(--gold); }
.whero p { color: #B9C6D3; font-size: 17px; max-width: 52ch; }
.wsearch { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(0,1fr) auto; gap: 8px; padding: 8px; border-radius: 16px; background: #fff; max-width: 760px; color: #111827; }
.wsearch select { border: 0; height: var(--btn-h); padding: 0 12px; border-radius: 10px; background: #F1F5F9; color: #111827; min-width: 0; }
.wstats { display: flex; gap: 32px; flex-wrap: wrap; margin-top: 8px; }
.wstats b { display: block; font-family: var(--font-num); font-size: 28px; color: #fff; }
.wstats span { color: #B9C6D3; font-size: 13px; }
.wsec { max-width: 1180px; margin: 0 auto; padding: 48px 16px 8px; display: grid; gap: 20px; }
.wsec > header { display: grid; gap: 6px; }
.wsec h2 { font-size: 28px; font-weight: 700; }
.wsec > header p { color: var(--muted); max-width: 60ch; }
.groups { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.gcard { border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); overflow: hidden; display: flex; flex-direction: column; }
.gcard header { padding: 14px; color: #fff; background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 45%, #0B1220)); display: flex; align-items: center; gap: 10px; }
.gcard header .ico { width: 26px; height: 26px; }
.gcard header h3 { font-size: 15px; font-weight: 600; }
.gcard header span { font-size: 12px; opacity: .85; display: block; }
.gcard ul { list-style: none; margin: 0; padding: 6px; display: grid; }
.gcard li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 7px 8px; border-radius: 8px; text-align: start; font-size: 13px; }
.gcard li button:hover { background: var(--brand-soft); }
.gcard li .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.vgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.vgrid .fcard { width: auto; }
.vgrid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs button { border: 0; background: none; padding: 0; color: var(--brand-text); font-weight: 500; }
.list-layout { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 24px; align-items: start; }
.minimap { position: sticky; top: 140px; padding: 12px; display: grid; gap: 8px; }
.minimap svg { width: 100%; height: auto; border-radius: 10px; background: var(--surface-2); }
.minimap circle.pt { fill: var(--brand); stroke: var(--surface); stroke-width: 1.5; }
.minimap circle.pt.hi { fill: var(--gold); }
.minimap text { fill: var(--muted); font-size: 9px; }
.wvenue { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 32px; align-items: start; }
.wvenue .art { border-radius: var(--r-lg); aspect-ratio: 21/9; }
.bookcard { position: sticky; top: 140px; padding: 18px; display: grid; gap: 14px; }
.bookcard .days { padding: 2px 0 6px; }
.bookcard .slots { grid-template-columns: repeat(4, 1fr); }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; align-items: stretch; }
.plan { padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; }
.plan.pop { border: 2px solid var(--brand); }
.plan .ribbon-pop { position: absolute; top: -12px; inset-inline-end: 18px; }
.plan h3 { font-size: 17px; font-weight: 600; }
.plan .amt { font-family: var(--font-num); font-size: 30px; font-weight: 700; }
.plan .amt small { font-size: 13px; font-weight: 500; color: var(--muted); font-family: var(--font); }
.plan ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; flex: 1; }
.plan li { display: flex; gap: 8px; }
.plan li .ico { color: var(--brand); width: 16px; height: 16px; margin-top: 2px; }
.plan .vatbox { border-radius: 10px; background: var(--surface-2); padding: 10px 12px; }
.plan .vatbox .r { padding: 3px 0; font-size: 12px; }
.comm { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; padding: 24px; align-items: center; }
.flow { display: grid; gap: 10px; }
.flowbar { display: flex; height: 44px; border-radius: 10px; overflow: hidden; font-size: 12px; font-weight: 600; }
.flowbar div { display: grid; place-items: center; color: #fff; padding: 0 6px; white-space: nowrap; overflow: hidden; }
.steps6 { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; counter-reset: s; }

.steps6 .n { font-family: var(--font-num); font-weight: 700; color: var(--brand-text); font-size: 13px; }
.wshop { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 24px; align-items: start; }
.wshop .shop-grid { grid-template-columns: repeat(4, minmax(0,1fr)); padding: 0; }
.cartcard { position: sticky; top: 140px; padding: 18px; display: grid; gap: 12px; }
.wfoot { margin-top: 56px; border-top: 1px solid var(--border); background: var(--surface); }
.wfoot-in { max-width: 1180px; margin: 0 auto; padding: 28px 16px; display: flex; gap: 24px; flex-wrap: wrap; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }
@media (max-width: 1000px) {
  .groups, .vgrid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .vgrid.three { grid-template-columns: repeat(2, minmax(0,1fr)); }

@media (max-width: 640px) {

  .wnav nav { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .wnav .end .btn.ghost { display: none; }
  .steps6 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .wshop .shop-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .whero-in { padding: 40px 16px; }
  .wsec h2 { font-size: 22px; }
  .wstats { gap: 20px; }
  .wstats b { font-size: 22px; }
}

/* ---------- BUSINESS ---------- */
.biz { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: calc(100vh - 100px); }
.bside { background: var(--ink); color: var(--on-ink); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; --lg-ink: #fff; --lg-eqo: #14C08E; --lg-tag: #14C08E; --lg-lane: #0B1220; --lg-dot: #FFB800; }
.bside .logo { height: 30px; }
.bside .bizlbl { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); padding-inline-start: 4px; }
.bside nav { display: grid; gap: 2px; position: sticky; top: 130px; }
.bside nav button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--on-ink-muted); padding: 10px 12px; border-radius: 10px; font-weight: 500; text-align: start; }
.bside nav button:hover { background: rgba(255,255,255,.06); color: #fff; }
.bside nav button[aria-current="true"] { background: #087A5A; color: #fff; }
.bmain { padding: 24px; display: grid; gap: 20px; align-content: start; min-width: 0; }
.bhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.bhead h1 { font-size: 22px; font-weight: 700; }
.bhead .vtag { display: flex; align-items: center; gap: 10px; margin-inline-start: auto; padding: 6px 12px 6px 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.bhead .vtag .art { width: 36px; height: 36px; border-radius: 8px; aspect-ratio: 1; }
.bhead .vtag .art .big { width: 90%; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.kpi { padding: 16px; display: grid; gap: 4px; }
.kpi .l { font-size: 12px; color: var(--muted); font-weight: 500; }
.kpi .v { font-family: var(--font-num); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .d { font-size: 12px; font-weight: 600; color: var(--brand-text); }
.kpi .d.down { color: var(--danger); }
.bgrid { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 16px; }
.panel { padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.panel h3 { font-size: 16px; font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--font-num); }
.chart .area { fill: var(--brand); fill-opacity: .12; }
.chart .line { fill: none; stroke: var(--brand); stroke-width: 2; stroke-linejoin: round; }
.chart .pt { fill: var(--surface); stroke: var(--brand); stroke-width: 2; }
.chart .end { fill: var(--brand); stroke: var(--surface); stroke-width: 2; }
.chart .endlbl { fill: var(--text); font-size: 12px; font-weight: 700; font-family: var(--font-num); }
.chart .hit { fill: transparent; }
.chart { position: relative; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); }
.rlist { display: grid; gap: 0; }
.rlist > div { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.rlist > div:last-child { border-bottom: 0; }
.rlist b { font-size: 13px; font-weight: 600; display: block; }
.rlist .avatar { width: 34px; height: 34px; font-size: 12px; }
.cal-wrap { overflow-x: auto; }
.cal { display: grid; grid-template-columns: 52px repeat(7, minmax(96px, 1fr)); min-width: 740px; position: relative; }
.cal .ch { padding: 8px; font-size: 12px; font-weight: 600; text-align: center; border-bottom: 1px solid var(--border); color: var(--muted); }
.cal .ch.today { color: var(--brand-text); }
.cal .ch b { display: block; font-size: 16px; color: var(--text); font-family: var(--font-num); }
.cal .ch.today b { color: var(--brand-text); }
.cal .hrs { position: relative; }
.cal .hrs div { height: 34px; font-size: 10px; color: var(--muted); text-align: end; padding-inline-end: 6px; transform: translateY(-6px); font-family: var(--font-num); }
.cal .col { position: relative; border-inline-start: 1px solid var(--border); background: repeating-linear-gradient(to bottom, transparent 0 33px, var(--border) 33px 34px); }
.cal .ev { position: absolute; inset-inline: 3px; border-radius: 6px; padding: 3px 6px; font-size: 10.5px; line-height: 1.25; overflow: hidden; background: var(--brand-soft); color: var(--text); border-inline-start: 3px solid var(--brand); }
.cal .ev.c2 { background: var(--info-soft); border-color: var(--info); }
.cal .ev.c3 { background: var(--gold-soft); border-color: var(--gold); }
.cal .ev b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .now { position: absolute; inset-inline: 0; height: 2px; background: var(--danger); z-index: 2; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: start; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
[dir="rtl"] .tbl th { letter-spacing: 0; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stmt { display: grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap: 28px; align-items: start; }
.stmt .bill .r { font-size: 14px; }
.payout-net { padding: 16px; border-radius: var(--r-md); background: var(--ink); color: #fff; display: grid; gap: 4px; }
.payout-net span { color: var(--on-ink-muted); font-size: 12px; }
.payout-net b { font-family: var(--font-num); font-size: 28px; color: #14C08E; font-variant-numeric: tabular-nums; }
.rlist > .rateplayer { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--surface-2); border-bottom: 0; margin-bottom: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } .bgrid, .stmt { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .biz { grid-template-columns: 1fr; }
  .bside { padding: 12px 16px; flex-direction: row; align-items: center; gap: 12px; position: sticky; top: 108px; z-index: 5; overflow-x: auto; }
  .bside .bizlbl, .bside > .logo-wrap { display: none; }
  .bside nav { display: flex; position: static; }
  .bside nav button { white-space: nowrap; padding: 8px 10px; font-size: 13px; }
  .bside nav button .ico { display: none; }
  .bmain { padding: 16px; }
  .kpi .v { font-size: 20px; }
}

/* ---------- ADMIN ---------- */
.adm { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
.adm h1 { font-size: 24px; font-weight: 700; }
.adm-tiles { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 14px; }
.alerts { display: grid; gap: 10px; }
.alert { display: grid; grid-template-columns: 6px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.5fr) auto; gap: 16px; align-items: center; padding: 14px 16px 14px 0; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
[dir="rtl"] .alert { padding: 14px 0 14px 16px; }
.alert .sev { align-self: stretch; background: var(--warning); }
.alert .sev.crit { background: var(--danger); }
.alert .sev.watch { background: var(--border-strong); }
.alert .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.alert .who b { display: block; font-weight: 600; font-size: 14px; }
.cmp { display: grid; gap: 4px; font-size: 12px; }
.cmp .bars { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.cmp .bars i { position: absolute; inset-block: 0; inset-inline-start: 0; border-radius: 4px; background: var(--danger); }
.cmp .bars u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
.cmp .nums { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.cmp .nums b { font-size: 16px; font-family: var(--font-num); color: var(--danger); }
.quotes { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.quotes q { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acts4 { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.acts4 .btn.sm { min-height: 36px; padding: 0 12px; }
.btn.warn { background: var(--warning-soft); color: var(--warning); }
.btn.susp { background: var(--danger-soft); color: var(--danger); }
.btn.ban { background: var(--danger); color: #fff; }
.alert.resolved { opacity: .75; }
.complaint { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto; gap: 16px; align-items: center; padding: 14px 16px; }
.window { display: grid; gap: 4px; font-size: 12px; }
.window .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.window .bar i { display: block; height: 100%; background: var(--warning); }
@media (max-width: 1000px) {
  .adm-tiles { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .adm-tiles > :first-child { grid-column: 1 / -1; }
  .alert { grid-template-columns: 6px minmax(0,1fr) minmax(0,1fr); padding-block: 14px; }
  .alert .sev { grid-row: span 3; }
  .alert .quotes, .alert .acts4 { grid-column: 2 / -1; }
  .acts4 { justify-content: flex-start; }
  .complaint { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .alert { grid-template-columns: 6px minmax(0,1fr); }
  .alert .sev { grid-row: span 4; }
  .alert > *:not(.sev) { grid-column: 2; }
}
/* programmes, pass, onboarding, approvals */
.pertabs button { display: grid; line-height: 1.15; padding: 6px 2px; font-size: 12px; }
.pertabs small { font-size: 10px; color: var(--brand-text); font-weight: 600; }
.passhero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 18px; color: #fff; background: linear-gradient(160deg, #0B1220 0%, #03392A 100%); display: grid; gap: 6px; --lg-lane: #0B1220; --lg-dot: #FFB800; }
.passhero .lanes path { fill: none; stroke: #FFB800; stroke-opacity: .18; stroke-width: 1.5; }
.passhero > :not(.lanes) { position: relative; }
.passhero .lanes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.passhero .ph-top { display: flex; justify-content: space-between; align-items: center; }
.passhero h2 { font-size: 24px; font-weight: 800; font-style: italic; }
.passhero p { color: #B9C6D3; font-size: 13px; }
.benefits { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.benefits li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.benefits .ico { color: var(--brand); }
.benefits.on-dark li { color: #E8EEF3; }
.benefits.on-dark .ico { color: #FFB800; }
.passplans { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.passplans.wide { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.passplan { display: grid; gap: 4px; align-content: start; text-align: start; padding: 12px; border-radius: var(--r-md); border: 1.5px solid var(--border); background: var(--surface); }
.passplan[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.passplan b { font-weight: 600; font-size: 14px; }
.passplan .pp { font-family: var(--font-num); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.credit { display: grid; grid-template-columns: auto auto auto 1fr auto; gap: 10px; align-items: center; padding: 12px; border-radius: var(--r-md); border: 1px solid var(--border); background: var(--surface); }
.credit > div { display: grid; }
.credit b { font-size: 14px; font-variant-numeric: tabular-nums; }
.credit .ico { color: var(--muted); }
.credit .badge { justify-self: start; }
.credits2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wpass { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.wpass .passhero { padding: 24px; gap: 14px; align-content: start; }
.pill { padding: 6px 10px; font-size: 12px; white-space: normal; }
.stepper { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.stepper li { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; padding: 8px; border-radius: 10px; background: var(--brand-soft); }
.stepper .b { width: 22px; height: 22px; border-radius: 50%; background: var(--action); color: #fff; display: grid; place-items: center; flex: none; }
.stepper .b .ico { width: 13px; height: 13px; }
.obgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.obc { border: 1px solid var(--border); border-radius: var(--r-md); padding: 14px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.obc.wide { grid-column: span 2; }
.obc h4 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.obc h4 .ico { color: var(--brand); }
.obmap { width: 100%; height: auto; display: block; }
.facs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.facs.ro { display: flex; flex-wrap: wrap; }
.facs.ro .chip { min-height: 28px; font-size: 11px; padding: 0 10px; }
.fac { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 12px; text-align: start; min-height: 36px; }
.fac .ico { color: var(--muted); }
.fac .cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; flex: none; }
.fac[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.fac[aria-pressed="true"] .cb { background: var(--action); border-color: var(--action); color: #fff; }
.fac[aria-pressed="true"] > .ico { color: var(--brand); }
.ptiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ptiles.row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.appcard > * { min-width: 0; }
.ptile { position: relative; border-radius: 8px; overflow: hidden; aspect-ratio: 4 / 3; }
.ptile .art { aspect-ratio: 4 / 3; height: 100%; }
.ptile .badge { position: absolute; top: 4px; inset-inline-start: 4px; }
.ptile.add { border: 1.5px dashed var(--border-strong); background: var(--surface-2); display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.ptile.sm { width: 64px; flex: none; }
.ptile.more { display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 13px; }
.appgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.appcard { padding: 16px; display: grid; gap: 12px; align-content: start; }
.appcard .who { display: flex; gap: 10px; align-items: flex-start; }
.appcard .who b { display: block; font-weight: 600; }
.appcard .who .meta { display: block; }
.appcard.resolved { opacity: .85; }
.docs { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; }
.doc { display: inline-flex; align-items: center; gap: 4px; }
.reasonform { display: grid; gap: 8px; width: 100%; }
@media (max-width: 1100px) { .obgrid { grid-template-columns: 1fr 1fr; } .stepper { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .appgrid, .wpass { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .obgrid { grid-template-columns: 1fr; } .obc.wide { grid-column: auto; } .stepper { grid-template-columns: 1fr 1fr; } .credits2 { grid-template-columns: 1fr; } .credit { grid-template-columns: auto auto auto 1fr; } .credit .btn { grid-column: 1 / -1; } }

/* ---------- Sporteqo Fuel ---------- */
:root { --m-carb: #C2620A; --m-fat: #7C4DDB; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --m-carb: #F2A35E; --m-fat: #B79CFF; } }
:root[data-theme="dark"] { --m-carb: #F2A35E; --m-fat: #B79CFF; }
.ring .trk { fill: none; stroke: var(--surface-2); }
.fuelcard { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--brand-soft-2); background: linear-gradient(135deg, var(--brand-soft), var(--surface) 70%); text-align: start; color: var(--text); }
.fuelcard .fc-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.fuelcard b { font-weight: 600; display: flex; gap: 6px; align-items: center; }
.fuelcard > .ico { color: var(--muted); }
.mi { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; }
.trainb { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--ink); color: #fff; align-items: flex-start; }
.trainb > .ico { color: #14C08E; margin-top: 2px; }
.trainb b { display: block; font-weight: 600; font-size: 13px; }
.trainb span { display: block; font-size: 12px; color: var(--on-ink-muted); margin-top: 2px; }
.fring { padding: 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; }
.bigring { position: relative; width: 128px; height: 128px; }
.bigring .rc { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.bigring .rc b { font-family: var(--font-num); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.bigring .rc span { font-size: 11px; color: var(--muted); }
.fstat { margin: 0; display: grid; gap: 8px; }
.fstat div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.fstat div:last-child { border: 0; padding: 0; }
.fstat dt { color: var(--muted); }
.fstat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fstat small { font-weight: 400; color: var(--muted); }
.mrings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mring { display: grid; justify-items: center; gap: 1px; padding: 12px 4px; text-align: center; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); font-size: 12px; min-width: 0; }
.mring b { font-weight: 600; font-size: 13px; margin-top: 4px; }
.mring .meta { justify-content: center; font-size: 11px; }
.meal { padding: 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--border); display: grid; gap: 6px; }
.meal .mh, .meal.empty { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.meal.empty { border-style: dashed; background: transparent; }
.meal .mh b, .meal.empty b { display: block; font-weight: 600; font-size: 14px; }
.mitems { list-style: none; margin: 0; padding: 0; display: grid; }
.mitems li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--border); font-size: 13px; }
.mitems li b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn.xs { width: 36px; height: 36px; color: var(--muted); }
.water { padding: 12px 14px; display: grid; gap: 8px; }
.glasses { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; }
.glass { height: 44px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--border-strong); }
.glass svg { width: 22px; height: 28px; }
.glass .wf { fill: transparent; }
.glass.on { color: var(--info); }
.glass.on .wf { fill: var(--info); fill-opacity: .35; }
.fnote { display: flex; gap: 6px; font-size: 12px; color: var(--muted); align-items: flex-start; }
.fnote .ico { margin-top: 2px; }
.fsheet { display: flex; flex-direction: column; gap: 12px; }
.fsheet > * { flex: none; }
.fmodes button { display: grid; place-items: center; gap: 2px; font-size: 12px; min-height: 52px; padding: 4px 2px; }
.fmodes .ico { width: 18px; height: 18px; }
.plist { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--border); border-radius: var(--r-md); }
.plist li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--border); font-size: 13px; }
.plist li:first-child { border: 0; }
.plist b { font-weight: 600; }
.cam { position: relative; border-radius: var(--r-md); overflow: hidden; background: #0B1220; aspect-ratio: 4 / 3; display: grid; place-items: center; }
.cam.small { aspect-ratio: 16 / 9; }
.cam .plate { width: 74%; height: auto; }
.cam.small .plate { width: 56%; }
.cam .cframe { position: absolute; inset: 8%; width: 84%; height: 84%; fill: none; stroke: #fff; stroke-width: 1.2; stroke-opacity: .8; }
.camhint { position: absolute; bottom: 8px; inset-inline: 0; text-align: center; color: #fff; font-size: 12px; font-weight: 500; }
.cam .scanning { position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(20,192,142,.45), transparent) no-repeat; background-size: 100% 35%; animation: sweep 1.1s linear infinite; }
@keyframes sweep { from { background-position: 0 -60%; } to { background-position: 0 160%; } }
.tagl { position: absolute; background: rgba(11,18,32,.82); color: #fff; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 6px; white-space: nowrap; border: 1px solid #14C08E; }

// ---- "Type it": a small keyword matcher over the food table ----
const QW = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, half: 0.5, couple: 2, 'واحد': 1, 'واحدة': 1, 'اتنين': 2, 'اثنين': 2, 'تلاتة': 3, 'ثلاثة': 3, 'تلات': 3, 'اربعة': 4, 'أربعة': 4, 'خمسة': 5, 'نص': 0.5 };
const DUAL = { 'بيضتين': 2, 'رغيفين': 2, 'بلحتين': 2 };
const FILLER = /^(a|an|of|the|some|cup|cups|piece|pieces|plate|bowl|glass|slice|with|sugar|and|my|for|small|big|large|medium|كوباية|طبق|حتة|قطعة|مع|بسكر|سكر|شوية)$/;
let KWL = null;
function kwList() {
  if (KWL) return KWL; KWL = [];
  S.d.foods.forEach((f) => f.kw.concat([f.en.toLowerCase().replace(/\s*\(.*\)/, ''), f.ar]).forEach((k) => { k = k.toLowerCase().trim(); if (k && !KWL.some((x) => x.k === k)) KWL.push({ k, f: f.id, lat: !/[؀-ۿ]/.test(k), re: new RegExp('(^|[^a-z0-9؀-ۿ])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '(?:e?s)?(?=$|[^a-z0-9؀-ۿ])') }); }));
  KWL.sort((a, b) => b.k.length - a.k.length); return KWL;
}
function parseMeal(text) {
  const items = [], miss = [];

  s = s.replace(/(^|\s)و(?=[ء-ي])/g, '$1, ');
  s.split(/\s*(?:,|;|\+|&|\band\b|\bplus\b|\n)\s*/).filter((c) => c.trim()).forEach((chunk) => {
    const src = ' ' + chunk + ' '; let rest = src; const hits = [];
    kwList().forEach(({ k, f, lat, re }) => {
      let idx, len;
      if (lat) { const m = re.exec(rest); if (!m) return; idx = m.index + m[1].length; len = m[0].length - m[1].length; }
      else { idx = rest.indexOf(k); if (idx < 0) return; len = k.length; }
      hits.push({ f, idx, len, k }); rest = rest.slice(0, idx) + ' '.repeat(len) + rest.slice(idx + len);
    });
    if (!hits.length) { const words = chunk.trim().split(/\s+/).filter((w) => w.length > 2 && !FILLER.test(w) && !/^\d/.test(w) && !(w in QW)); if (words.length) miss.push(chunk.trim()); return; }
    hits.sort((a, b) => a.idx - b.idx);
    let prev = 0;
    hits.forEach((h) => {
      const seg = src.slice(prev, h.idx); prev = h.idx + h.len; const f = FD[h.f];
      const gm = seg.match(/(\d+(?:\.\d+)?)\s*(?:g|gm|gr|grams?|جم|جرام)(?![a-z])/);
      let qty = DUAL[h.k] || null;
      if (!qty) { const nm2 = seg.match(/(\d+(?:\.\d+)?)(?!.*\d)/); if (nm2) qty = +nm2[1]; else { const w = seg.trim().split(/\s+/).reverse().find((x) => x in QW); if (w) qty = QW[w]; } }
      const g = gm ? +gm[1] : qty ? qty * (f.each && qty >= 1 ? f.each : f.g) : f.g;
      if (g > 0) items.push({ food: f.id, g: Math.round(g) });
    });
  });
